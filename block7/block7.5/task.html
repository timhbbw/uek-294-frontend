<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommentsPage</title>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', async () => {
            const sendmessageform = document.forms.comment;
            const url = 'http://10.71.4.41'

            sendmessageform.addEventListener('submit', async (event) => {
                sendMessage(sendmessageform);
            });

            async function sendMessage(messageform) {
                const tokenresponse = await fetch(url + '/challenges/1', {
                    method: 'POST'
                });

                let token = tokenresponse.headers.get('Authorization');

                const response = await fetch(url + '/comments', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `${token}`
                    },
                    body: JSON.stringify({
                        message: messageform.message.value,
                        username: messageform.username.value
                    })
                });


                if (!response.ok) {
                    alert('Something went wrong while sending your message');
                    console.log(response.json);
                } else {
                    alert('Your message: ' + messageform.message.value + ' was sent!');
                }
            }


            async function displayComments() {
                const response = await fetch(url + '/comments', {
                    method: 'GET'
                });
                let comments = await response.json();

                const posts = document.querySelector('.post');
                
                comments.forEach(comment => {
                    const commentdiv = document.createElement('div');

                    const commentusername = document.createElement('p');
                    commentusername.innerText = comment.username;
                    commentdiv.append(commentusername);

                    const commentmessage = document.createElement('p');
                    commentmessage.innerText = comment.message;
                    commentdiv.append(commentmessage);

                    
                    posts.appendChild(commentdiv);

                });
            }

            displayComments();
        });
    </script>
    <style>
        .forms {
            display: flex;
            flex-direction: column;
            justify-self: center;
            text-align: center;
        }
    </style>
</head>

<body>
    <form name="comment" class="forms">
        <label for="username">Username:</label>
        <input type="text" name="username" minlength="3" maxlength="16" required>

        <label for="message">Message:</label>
        <input type="text" name="message" minlength="3" maxlength="300" required>

        <button type="submit">Send!</button>
    </form>
    <div class="post">

    </div>
</body>

</html>
