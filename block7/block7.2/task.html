<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task7.2</title>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const url = 'https://jsonplaceholder.typicode.com/posts';

            async function loadBlogPosts() {
                const result = await fetch(url);

                const blogposts = await result.json();

                const postdivs = document.getElementById('posts');

                postdivs.replaceChildren([]);

                blogposts.forEach(blogpost => {
                    const blogarticle = document.createElement('article');
                    const blogtitle = document.createElement('h2');
                    const deleteblogbutton = document.createElement('button');
                    deleteblogbutton.onclick = () => deletePost(blogpost.id);

                    blogtitle.innerText = blogpost.title;
                    blogarticle.appendChild(blogtitle);

                    const blogContent = document.createElement('p');
                    blogContent.innerText = blogpost.body;
                    blogarticle.appendChild(blogContent);

                    postdivs.appendChild(blogarticle);
                });
            };

            async function deletePost(postid){
                const response = await fetch(url, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json;charset=utf-8' 
                    },
                    body: JSON.stringify(postid)
                });
                const result = await response.json();
                alert(result.message)
            }
            
        });
    </script>
    <style>
        .post {
            border: 1px solid black;
            margin: 1rem;
            padding: 1rem;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }
        .post-title {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .post-body {
            font-size: 1rem;
        }
        body {
            background-color: lightblue;
        }
    </style>
</head>

<body>
<h1>Blog</h1>
    <button id="refreshbutton">Refresh</button>
    <div id="posts">
        
    </div>
</body>

</html>
