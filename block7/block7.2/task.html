<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task7.2</title>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const refreshbutton = document.getElementById('refreshbutton');

            const addpost = document.forms.addPost;

            refreshbutton.addEventListener('click', loadBlogPosts);
            const url = 'https://jsonplaceholder.typicode.com/posts';

            async function loadBlogPosts() {
                const result = await fetch(url);

                const blogposts = await result.json();

                const postdivs = document.getElementById('posts');

                postdivs.replaceChildren();

                blogposts.forEach(blogpost => {
                    postdivs.appendChild(CreateBlogPost(blogpost));
                });

            };

            async function deletePost(postid, blogarticle) {
                const response = await fetch(url + '/' + postid, {
                    method: 'DELETE'
                });
                
                if(!response.ok){
                    alert('Something went wrong while deleting this post');
                    return;
                }
                else{
                    blogarticle.remove();
                }
            }

            addpost.addEventListener('submit', async (event) => {
                event.preventDefault();
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json;charset=utf-8'
                    },
                    body: JSON.stringify(addpost.title,addpost.content)
                });
                alert(response.body);
                console.log('form submitted');
            });

            function CreateBlogPost(blogpost) {
                const blogarticle = document.createElement('article');

                const blogtitle = document.createElement('h2');
                blogtitle.innerText = blogpost.title;
                blogarticle.appendChild(blogtitle);

                const blogContent = document.createElement('p');
                blogContent.innerText = blogpost.body;
                blogarticle.appendChild(blogContent);

                const deleteblogbutton = document.createElement('button');
                deleteblogbutton.innerText = 'Delete this Post.'
                deleteblogbutton.onclick = () => deletePost(blogpost.id, blogarticle);
                blogarticle.appendChild(deleteblogbutton);

                return blogarticle;
            }

        });
    </script>
    <style>
        .post {
            border: 1px solid black;
            margin: 1rem;
            padding: 1rem;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }

        .post-title {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .post-body {
            font-size: 1rem;
        }

        body {
            background-color: lightblue;
        }
    </style>
</head>

<body>
    <h1>Blog</h1>
    <form name="addPost">
        <label for="title">Titel</label>
        <input type="text" name="title" placeholder="Lorem Ipsum">

        <label for="content">Inhalt</label>
        <input type="text" name="content" placeholder="Lorem Ipsum Dolor ...">

        <button type="submit">Hinzufügen</button>
    </form>
    <button id="refreshbutton">Refresh</button>
    <div id="posts">

    </div>
</body>

</html>
