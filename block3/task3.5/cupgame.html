<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Becher Spiel</title>
    <link rel="stylesheet" href="style.css">
    <script src="cupgame.js" defer></script>
</head>

<body>

    <h1>Wähle einen Becher</h1>

    <div class="grid">

        <img src="cup.png" class="cup" onclick="becherKlick(this, 0)">

        <img src="cup.png" class="cup" onclick="becherKlick(this, 1)">

        <img src="cup.png" class="cup" onclick="becherKlick(this, 2)">

    </div>

    <button onclick="shuffleCups()">Shuffle</button>

    <p>
        <span id="incorrect">0</span>
    </p>

</body>

</html>
